<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ROCF 电子化测评系统</title>
<style>
/* ============================================================
   Reset & Base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  background: #ebebeb; color: #333; min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* ============================================================
   Page Container — all pages hidden by default
   ============================================================ */
.page { display: none; width: 100%; min-height: 100dvh; }
.page.active { display: flex; }

/* ============================================================
   Page 0: Main Menu
   ============================================================ */
#page-menu {
  flex-direction: column; align-items: center; justify-content: center;
  padding: 20px; gap: 16px;
}
#page-menu .title { font-size: 22px; font-weight: bold; color: #222; text-align: center; }
#page-menu .subtitle { font-size: 14px; color: #666; text-align: center; }
#page-menu .btn {
  border: 1px solid #bbb; border-radius: 6px; padding: 12px 20px;
  font-size: 16px; cursor: pointer; width: 260px; max-width: 90vw;
  text-align: center; transition: background 0.15s;
}
.btn-start { background: #4a90d9; color: #fff; border-color: #3a80c9; font-weight: bold; font-size: 18px !important; }
.btn-start:hover { background: #5aa0e9; }
.btn-history { background: #5cb85c; color: #fff; border-color: #4ca84c; font-size: 18px !important; }
.btn-history:hover { background: #6cc86c; }
.btn-exit { background: #d9534f; color: #fff; border-color: #c9433f; font-size: 18px !important; }
.btn-exit:hover { background: #e9635f; }
#page-menu .footer { font-size: 12px; color: #aaa; margin-top: 20px; text-align: center; }

/* ============================================================
   Page 1: Experiment (3-zone)
   ============================================================ */
#page-experiment {
  flex-direction: row; height: 100dvh; overflow: hidden;
}
/* Left: stimulus */
.exp-left {
  flex: 3; display: flex; flex-direction: column; padding: 8px;
  min-width: 0;
}
.exp-left .top-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 4px 8px; flex-shrink: 0;
}
.exp-left .phase-label { font-size: 16px; font-weight: bold; color: #333; }
.exp-left .timer-label { font-size: 18px; font-weight: bold; color: #c00; }
.exp-left .stimulus-canvas {
  flex: 1; min-height: 0; width: 100%; border: 1px solid #ddd;
  background: #f8f8f8; border-radius: 4px;
}
.exp-left .status-label {
  text-align: center; font-size: 13px; color: #555; padding: 4px; flex-shrink: 0;
}
/* Middle: canvas */
.exp-mid {
  flex: 2; display: flex; flex-direction: column; padding: 8px;
  min-width: 140px;
}
.exp-mid .drawing-canvas {
  flex: 1; width: 100%; border: 1px solid #ccc; background: #fff;
  border-radius: 4px; cursor: crosshair;
}
/* Right: toolbar */
.exp-right {
  flex: 0 0 140px; display: flex; flex-direction: column;
  background: #f5f5f5; border-left: 1px solid #ccc; padding: 16px 10px;
  gap: 8px; overflow-y: auto;
}
.exp-right .section-title {
  font-size: 14px; font-weight: bold; color: #555; text-align: center;
}
.tool-btn {
  border: 1px solid #bbb; border-radius: 4px; padding: 6px 8px;
  font-size: 13px; cursor: pointer; background: #f5f5f5; text-align: center;
}
.tool-btn:hover { background: #e0e0e0; }
.tool-btn.active { background: #4a90d9; color: #fff; border-color: #3a80c9; }
.tool-btn.done { background: #5cb85c; color: #fff; font-weight: bold; }
.tool-btn.back { background: #d9534f; color: #fff; }

/* ============================================================
   Page 2: Distractor
   ============================================================ */
#page-distractor {
  flex-direction: column; align-items: center; justify-content: center;
  gap: 12px;
}
#page-distractor .dist-title { font-size: 20px; color: #888; }
#page-distractor .dist-count { font-size: 56px; font-weight: bold; color: #333; }
#page-distractor .dist-hint { font-size: 15px; color: #aaa; }

/* ============================================================
   Page 3: History
   ============================================================ */
#page-history {
  flex-direction: column; padding: 20px; max-width: 800px; margin: 0 auto;
}
#page-history .hist-title {
  font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 16px;
}
#page-history table {
  width: 100%; border-collapse: collapse; font-size: 14px;
}
#page-history th, #page-history td {
  border: 1px solid #ddd; padding: 8px; text-align: center;
}
#page-history th { background: #f0f0f0; font-weight: bold; }
#page-history tr { cursor: pointer; }
#page-history tr:hover { background: #f9f9f9; }
#page-history .hist-back {
  border: none; border-radius: 4px; padding: 10px 20px; cursor: pointer;
  font-size: 16px; background: #d9534f; color: #fff; margin-top: 16px;
  align-self: center;
}
#page-history .empty-msg { text-align: center; color: #999; padding: 40px; font-size: 15px; }

/* ============================================================
   Dialog overlay
   ============================================================ */
.dialog-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35);
  z-index: 1000; align-items: center; justify-content: center;
}
.dialog-overlay.show { display: flex; }
.dialog-box {
  background: #fff; border-radius: 8px; padding: 24px; min-width: 280px;
  max-width: 90vw; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.dialog-box h3 { font-size: 18px; margin-bottom: 16px; color: #222; }
.dialog-box .field { margin-bottom: 12px; }
.dialog-box label { display: block; font-size: 14px; color: #555; margin-bottom: 4px; }
.dialog-box input, .dialog-box select {
  width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
  font-size: 14px;
}
.dialog-box .btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.dialog-box .btns button {
  padding: 8px 20px; border: 1px solid #bbb; border-radius: 4px;
  font-size: 14px; cursor: pointer;
}
.dialog-box .btn-ok { background: #4a90d9; color: #fff; border-color: #3a80c9; }
.dialog-box .btn-cancel { background: #f5f5f5; }
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.75); color: #fff; padding: 10px 24px;
  border-radius: 20px; font-size: 14px; z-index: 2000; opacity: 0;
  transition: opacity 0.25s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* ============================================================
   Responsive: mobile portrait
   ============================================================ */
@media (max-width: 768px) {
  #page-experiment {
    flex-direction: column;
  }
  .exp-left { flex: none; height: 35vh; }
  .exp-mid { flex: 1; min-height: 200px; }
  /* Toolbar moves to bottom as horizontal strip */
  .exp-right {
    flex: 0 0 auto; flex-direction: row; flex-wrap: wrap;
    border-left: none; border-top: 1px solid #ccc; padding: 8px 6px;
    gap: 6px; justify-content: center;
  }
  .exp-right .section-title { display: none; }
  .tool-btn { font-size: 12px; padding: 5px 8px; }
  #page-menu .title { font-size: 18px; }
}
</style>
</head>
<body>

<!-- ============================================================
     Page 0: Main Menu
     ============================================================ -->
<div id="page-menu" class="page active">
  <div class="title">Rey-Osterrieth 复杂图形测验 (ROCF)</div>
  <div class="subtitle">电子化测评系统 v3.0 (Web)</div>
  <div style="height:20px"></div>
  <button class="btn btn-start" onclick="startNewTest()">开始新测验</button>
  <button class="btn btn-history" onclick="showHistory()">历史记录</button>
  <button class="btn btn-exit" onclick="showToast('桌面应用退出功能，Web 版请关闭标签页')">退出系统</button>
  <div class="footer">数据存储于浏览器本地 (localStorage)</div>
</div>

<!-- ============================================================
     Page 1: Experiment
     ============================================================ -->
<div id="page-experiment" class="page">
  <!-- Left: stimulus -->
  <div class="exp-left">
    <div class="top-bar">
      <span id="phaseLabel" class="phase-label">临摹阶段</span>
      <span id="timerLabel" class="timer-label">剩余时间: 10:00</span>
    </div>
    <canvas id="stimulusCanvas" class="stimulus-canvas"></canvas>
    <div class="status-label" id="statusLabel">笔画: 0</div>
  </div>
  <!-- Middle: drawing -->
  <div class="exp-mid">
    <canvas id="drawCanvas" class="drawing-canvas"></canvas>
  </div>
  <!-- Right: toolbar -->
  <div id="toolbar" class="exp-right">
    <span class="section-title">工具栏</span>
    <button class="tool-btn active" data-tool="thin" onclick="setTool('thin', this)">细笔</button>
    <button class="tool-btn" data-tool="thick" onclick="setTool('thick', this)">粗笔</button>
    <button class="tool-btn" data-tool="eraser" onclick="setTool('eraser', this)">橡皮</button>
    <button class="tool-btn" onclick="undoStroke()">撤销</button>
    <button class="tool-btn" onclick="redoStroke()">重做</button>
    <button class="tool-btn" onclick="clearCanvas()">清空</button>
    <button class="tool-btn done" onclick="finishPhase()">完成绘图</button>
    <button class="tool-btn back" onclick="goMenu()">返回菜单</button>
  </div>
</div>

<!-- ============================================================
     Page 2: Distractor
     ============================================================ -->
<div id="page-distractor" class="page">
  <div class="dist-title">干扰任务</div>
  <div class="dist-count" id="distCount">60</div>
  <div style="font-size:16px;color:#999;">秒</div>
  <div class="dist-hint">休息一下，不要回忆图形</div>
</div>

<!-- ============================================================
     Page 3: History
     ============================================================ -->
<div id="page-history" class="page">
  <div class="hist-title">历史测验记录</div>
  <div id="historyContent"></div>
  <button class="hist-back" onclick="goMenu()">返回菜单</button>
</div>

<!-- ============================================================
     Subject Info Dialog
     ============================================================ -->
<div id="subjectDialog" class="dialog-overlay">
  <div class="dialog-box">
    <h3>被试信息登记</h3>
    <div class="field">
      <label>被试编号</label>
      <input type="text" id="subjId" placeholder="默认 SUBJ001" value="SUBJ001">
    </div>
    <div class="field">
      <label>年龄</label>
      <input type="text" id="subjAge" placeholder="年龄">
    </div>
    <div class="field">
      <label>性别</label>
      <select id="subjGender">
        <option>男</option><option>女</option><option>其他</option>
      </select>
    </div>
    <div class="field">
      <label>利手</label>
      <select id="subjHand">
        <option>右利手</option><option>左利手</option><option>双利手</option>
      </select>
    </div>
    <div class="btns">
      <button class="btn-cancel" onclick="closeSubjectDialog(false)">取消</button>
      <button class="btn-ok" onclick="closeSubjectDialog(true)">确认</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script>
// ============================================================
// 全局状态
// ============================================================
const COPY_TIME = 600;       // 临摹 10 分钟
const RECALL_TIME = 600;     // 回忆 10 分钟
const DISTRACT_TIME = 60;    // 干扰 1 分钟

let currentPhase = '';       // 'copy' | 'recall'
let timeRemaining = 0;
let timerInterval = null;
let subject = {};
let timestamp = '';
let copyData = null;

// 绘图状态
let strokes = [];            // [{points: [{x,y}], tool, width}]
let redoStack = [];
let currentStroke = null;
let isDrawing = false;
let currentTool = 'thin';

// 画布引用
let stimulusCanvas, stimulusCtx;
let drawCanvas, drawCtx;

// ============================================================
// 页面切换
// ============================================================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
}

function goMenu() {
  stopTimer();
  showPage('menu');
}

// ============================================================
// Toast
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2000);
}

// ============================================================
// 被试信息对话框
// ============================================================
let subjectDialogResolve = null;

function openSubjectDialog() {
  return new Promise(resolve => {
    subjectDialogResolve = resolve;
    document.getElementById('subjId').value = 'SUBJ001';
    document.getElementById('subjAge').value = '';
    document.getElementById('subjGender').value = '男';
    document.getElementById('subjHand').value = '右利手';
    document.getElementById('subjectDialog').classList.add('show');
  });
}

function closeSubjectDialog(ok) {
  document.getElementById('subjectDialog').classList.remove('show');
  if (ok && subjectDialogResolve) {
    subjectDialogResolve({
      id: document.getElementById('subjId').value || 'SUBJ001',
      age: document.getElementById('subjAge').value,
      gender: document.getElementById('subjGender').value,
      hand: document.getElementById('subjHand').value,
    });
  } else if (!ok && subjectDialogResolve) {
    subjectDialogResolve(null);
  }
  subjectDialogResolve = null;
}

// ============================================================
// ROCF 图形绘制 (Canvas 2D — 18 个元素)
// ============================================================
function drawReyFigure(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#f8f8f8';
  ctx.fillRect(0, 0, w, h);
  ctx.save();

  // 标题
  ctx.font = '11px -apple-system, "PingFang SC", sans-serif';
  ctx.fillStyle = '#555';
  ctx.textAlign = 'center';
  ctx.fillText('标准刺激图', w / 2, 16);

  // 坐标系统（与 Python 版一致）
  const margin = 30;
  const h2 = h - 20;
  const dw = w - margin * 2;
  const dh = h2 - margin * 2 - 20;
  const size = Math.min(dw, dh) * 0.92;
  const ox = w / 2;
  const oy = margin + 10 + dh / 2;
  const s = size / 2;

  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.fillStyle = '#000';

  // Element 1: 十字标记（左上角）
  const cx = ox - s, cy = oy - s * 0.75;
  ctx.beginPath();
  ctx.moveTo(cx - 8, cy); ctx.lineTo(cx + 8, cy);
  ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy + 8);
  ctx.stroke();

  // Element 2: 大外框矩形
  ctx.strokeRect(ox - s, oy - s * 0.75, s * 2, s * 1.5);

  // Element 3: 对角线 (X)
  ctx.beginPath();
  ctx.moveTo(ox - s, oy + s * 0.75); ctx.lineTo(ox + s, oy - s * 0.75);
  ctx.moveTo(ox + s, oy + s * 0.75); ctx.lineTo(ox - s, oy - s * 0.75);
  ctx.stroke();

  // Element 4: 水平中线
  ctx.beginPath();
  ctx.moveTo(ox - s, oy); ctx.lineTo(ox + s, oy);
  ctx.stroke();

  // Element 5: 垂直中线
  ctx.beginPath();
  ctx.moveTo(ox, oy + s * 0.75); ctx.lineTo(ox, oy - s * 0.75);
  ctx.stroke();

  // Element 6: 左上小矩形
  const smW = s * 0.24, smH = s * 0.16;
  const smX = ox - s + smW / 2 + s * 0.02;
  const smY = oy - s * 0.75 + smH / 2 + s * 0.04;
  ctx.strokeRect(smX - smW / 2, smY - smH / 2, smW, smH);

  // Element 7: 上方水平短线
  const hx = ox - s + smW + s * 0.04;
  const hy = oy - s * 0.75 + smH / 2 + s * 0.04;
  ctx.beginPath();
  ctx.moveTo(hx - smW / 2, hy); ctx.lineTo(hx + smW / 2, hy);
  ctx.stroke();

  // Element 8: 内部平行线（4条）
  const pxStart = ox - s + s * 0.12;
  const pxStep = s * 0.07;
  for (let i = 0; i < 4; i++) {
    const px = pxStart + i * pxStep;
    ctx.beginPath();
    ctx.moveTo(px, oy + s * 0.375); ctx.lineTo(px, oy + s * 0.02);
    ctx.stroke();
  }

  // Element 9: 右上三角形
  const triX = ox + s + s * 0.18;
  ctx.beginPath();
  ctx.moveTo(ox + s, oy + s * 0.375);
  ctx.lineTo(triX, oy + s * 0.75);
  ctx.lineTo(triX, oy + s * 0.225);
  ctx.closePath();
  ctx.stroke();

  // Element 10: 三角形内竖线
  ctx.beginPath();
  ctx.moveTo(triX, oy + s * 0.4125); ctx.lineTo(triX, oy + s * 0.04);
  ctx.stroke();

  // Element 11: 右下圆+三点
  const circleR = s * 0.09;
  const circleX = ox + s * 0.5, circleY = oy - s * 0.525;
  ctx.beginPath();
  ctx.arc(circleX, circleY, circleR, 0, Math.PI * 2);
  ctx.stroke();
  for (let angle of [0, Math.PI * 2 / 3, Math.PI * 4 / 3]) {
    const dx = Math.cos(angle) * circleR * 1.25;
    const dy = Math.sin(angle) * circleR * 1.25;
    ctx.beginPath();
    ctx.arc(circleX + dx, circleY + dy, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Element 12: 右下斜线（5段）
  const slXBase = ox + s * 0.6;
  const slY = oy - s * 0.18;
  const slStep = s * 0.06;
  const slLen = s * 0.15;
  for (let i = 0; i < 5; i++) {
    const slX = slXBase + i * slStep;
    ctx.beginPath();
    ctx.moveTo(slX, slY); ctx.lineTo(slX, slY + slLen);
    ctx.stroke();
  }

  // Element 13: 左下菱形
  const diaX = ox - s * 0.45, diaY = oy - s * 0.22, diaR = s * 0.06;
  ctx.beginPath();
  ctx.moveTo(diaX, diaY - diaR);
  ctx.lineTo(diaX + diaR, diaY);
  ctx.lineTo(diaX, diaY + diaR);
  ctx.lineTo(diaX - diaR, diaY);
  ctx.closePath();
  ctx.stroke();

  // Element 14: 右侧小竖线（2条）
  ctx.beginPath();
  ctx.moveTo(ox + s, oy - s * 0.45); ctx.lineTo(ox + s + s * 0.05, oy - s * 0.45);
  ctx.moveTo(ox + s, oy - s * 0.55); ctx.lineTo(ox + s + s * 0.05, oy - s * 0.55);
  ctx.stroke();

  // Element 15-16: 左侧弧形短线（2条）
  ctx.beginPath();
  ctx.moveTo(ox - s, oy + s * 0.38); ctx.lineTo(ox - s - s * 0.05, oy + s * 0.38);
  ctx.moveTo(ox - s, oy + s * 0.50); ctx.lineTo(ox - s - s * 0.05, oy + s * 0.50);
  ctx.stroke();

  ctx.restore();
}

// ============================================================
// 绘制画布 — 所有笔画重绘
// ============================================================
function redrawCanvas() {
  if (!drawCtx) return;
  const cw = drawCanvas.width, ch = drawCanvas.height;
  drawCtx.clearRect(0, 0, cw, ch);
  drawCtx.fillStyle = '#fff';
  drawCtx.fillRect(0, 0, cw, ch);
  drawCtx.strokeStyle = '#ccc';
  drawCtx.lineWidth = 1;
  drawCtx.strokeRect(0.5, 0.5, cw - 1, ch - 1);

  for (const st of strokes) {
    drawStroke(st);
  }
  if (currentStroke) {
    drawStroke(currentStroke);
  }
}

function drawStroke(st) {
  if (!st.points || st.points.length < 2) return;
  drawCtx.save();
  drawCtx.lineCap = 'round';
  drawCtx.lineJoin = 'round';
  if (st.tool === 'eraser') {
    drawCtx.strokeStyle = '#fff';
    drawCtx.lineWidth = 20;
  } else {
    drawCtx.strokeStyle = '#000';
    drawCtx.lineWidth = st.width || 2;
  }
  drawCtx.beginPath();
  drawCtx.moveTo(st.points[0].x, st.points[0].y);
  for (let i = 1; i < st.points.length; i++) {
    drawCtx.lineTo(st.points[i].x, st.points[i].y);
  }
  drawCtx.stroke();
  drawCtx.restore();
}

// ============================================================
// 工具切换
// ============================================================
function setTool(tool, btn) {
  currentTool = tool;
  document.querySelectorAll('#toolbar .tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (tool === 'eraser') {
    drawCanvas.style.cursor = 'none';
  } else {
    drawCanvas.style.cursor = 'crosshair';
  }
}

// ============================================================
// 撤销 / 重做 / 清空
// ============================================================
function undoStroke() {
  if (strokes.length === 0) return;
  redoStack.push(strokes.pop());
  redrawCanvas();
  updateStatus();
}

function redoStroke() {
  if (redoStack.length === 0) return;
  strokes.push(redoStack.pop());
  redrawCanvas();
  updateStatus();
}

function clearCanvas() {
  strokes = [];
  redoStack = [];
  currentStroke = null;
  redrawCanvas();
  updateStatus();
}

function updateStatus() {
  document.getElementById('statusLabel').textContent = `笔画: ${strokes.length}`;
}

// ============================================================
// Canvas 鼠标/触摸事件
// ============================================================
function getCanvasPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = drawCanvas.width / rect.width;
  const scaleY = drawCanvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY,
  };
}

function getTouchPos(e) {
  const t = e.touches[0] || e.changedTouches[0];
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = drawCanvas.width / rect.width;
  const scaleY = drawCanvas.height / rect.height;
  return {
    x: (t.clientX - rect.left) * scaleX,
    y: (t.clientY - rect.top) * scaleY,
  };
}

function onDrawStart(e) {
  e.preventDefault();
  isDrawing = true;
  const pos = e.touches ? getTouchPos(e) : getCanvasPos(e);
  const width = currentTool === 'thick' ? 4 : 2;
  currentStroke = { points: [pos], tool: currentTool, width };
}

function onDrawMove(e) {
  e.preventDefault();
  if (!isDrawing || !currentStroke) return;
  const pos = e.touches ? getTouchPos(e) : getCanvasPos(e);
  currentStroke.points.push(pos);
  redrawCanvas();
}

function onDrawEnd(e) {
  if (!isDrawing || !currentStroke) return;
  isDrawing = false;
  strokes.push(currentStroke);
  redoStack = [];
  currentStroke = null;
  redrawCanvas();
  updateStatus();
}

// ============================================================
// 计时器
// ============================================================
function startTimer(seconds) {
  stopTimer();
  timeRemaining = seconds;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeRemaining--;
    updateTimerDisplay();
    if (timeRemaining <= 0) {
      stopTimer();
      finishPhase();
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function updateTimerDisplay() {
  const m = Math.floor(Math.max(0, timeRemaining) / 60);
  const s = Math.max(0, timeRemaining) % 60;
  document.getElementById('timerLabel').textContent =
    `剩余时间: ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

// ============================================================
// 测验流程
// ============================================================
async function startNewTest() {
  const subj = await openSubjectDialog();
  if (!subj) return;

  subject = subj;
  timestamp = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 15);
  // 格式: YYYYMMDD_HHMMSS
  const now = new Date();
  timestamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
  copyData = null;

  // 重置画布
  strokes = [];
  redoStack = [];
  currentStroke = null;
  currentTool = 'thin';
  document.querySelectorAll('#toolbar .tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
  const thinBtn = document.querySelector('#toolbar .tool-btn[data-tool="thin"]');
  if (thinBtn) thinBtn.classList.add('active');
  drawCanvas.style.cursor = 'crosshair';

  // 进入临摹阶段
  currentPhase = 'copy';
  document.getElementById('phaseLabel').textContent = '临摹阶段';
  document.getElementById('stimulusCanvas').style.display = '';
  updateStatus();
  initCanvases();
  redrawCanvas();
  drawReyFigure(stimulusCtx, stimulusCanvas.width, stimulusCanvas.height);
  showPage('experiment');
  startTimer(COPY_TIME);
}

function finishPhase() {
  stopTimer();
  if (currentPhase === 'copy') {
    copyData = { strokes: strokes.length };
    // 保存临摹截图
    downloadCanvasPNG(drawCanvas, `rocf_${subject.id}_copy_${timestamp}.png`);
    // 进入干扰任务
    currentPhase = 'distractor';
    showPage('distractor');
    startDistractor();
  } else if (currentPhase === 'recall') {
    // 回忆阶段完成
    const recallData = { strokes: strokes.length };
    downloadCanvasPNG(drawCanvas, `rocf_${subject.id}_recall_${timestamp}.png`);
    saveAndReport(recallData);
  }
}

function startDistractor() {
  let remaining = DISTRACT_TIME;
  document.getElementById('distCount').textContent = remaining;
  const distInterval = setInterval(() => {
    remaining--;
    document.getElementById('distCount').textContent = remaining;
    if (remaining <= 0) {
      clearInterval(distInterval);
      startRecall();
    }
  }, 1000);
}

function startRecall() {
  currentPhase = 'recall';
  strokes = [];
  redoStack = [];
  currentStroke = null;
  currentTool = 'thin';
  document.querySelectorAll('#toolbar .tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
  const thinBtn = document.querySelector('#toolbar .tool-btn[data-tool="thin"]');
  if (thinBtn) thinBtn.classList.add('active');
  drawCanvas.style.cursor = 'crosshair';

  document.getElementById('phaseLabel').textContent = '回忆阶段（凭记忆）';
  document.getElementById('stimulusCanvas').style.display = 'none';
  updateStatus();
  redrawCanvas();
  showPage('experiment');
  startTimer(RECALL_TIME);
}

function saveAndReport(recallData) {
  const record = {
    subject,
    timestamp,
    copy: copyData || { strokes: 0 },
    recall: recallData,
  };
  // 存 localStorage
  const records = JSON.parse(localStorage.getItem('rocf_records') || '[]');
  records.push(record);
  localStorage.setItem('rocf_records', JSON.stringify(records));
  // 下载 JSON
  downloadJSON(record, `rocf_${subject.id}_${timestamp}.json`);
  // 弹窗
  alert(
    `测验完成\n\n` +
    `被试: ${subject.id}\n` +
    `临摹笔画: ${copyData ? copyData.strokes : 'N/A'}\n` +
    `回忆笔画: ${recallData.strokes}\n\n` +
    `数据已保存到浏览器本地存储，JSON 文件已触发下载。`
  );
  goMenu();
}

// ============================================================
// 下载工具
// ============================================================
function downloadCanvasPNG(canvas, filename) {
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 'image/png');
}

function downloadJSON(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ============================================================
// 历史记录
// ============================================================
function showHistory() {
  const records = JSON.parse(localStorage.getItem('rocf_records') || '[]');
  const container = document.getElementById('historyContent');

  if (records.length === 0) {
    container.innerHTML = '<div class="empty-msg">暂无测验记录</div>';
  } else {
    let html = '<table><thead><tr><th>被试编号</th><th>测试时间</th><th>临摹笔画</th><th>回忆笔画</th></tr></thead><tbody>';
    // 倒序显示
    for (let i = records.length - 1; i >= 0; i--) {
      const r = records[i];
      const subj = r.subject || {};
      const ts = r.timestamp || '';
      let tsDisplay = ts;
      if (ts.length >= 13) {
        tsDisplay = `${ts.slice(0,4)}-${ts.slice(4,6)}-${ts.slice(6,8)} ${ts.slice(9,11)}:${ts.slice(11,13)}`;
      }
      const copyS = r.copy ? r.copy.strokes : '-';
      const recallS = r.recall ? r.recall.strokes : '-';
      html += `<tr onclick="showRecordDetail(${i})">
        <td>${escapeHtml(subj.id || '?')}</td>
        <td>${tsDisplay}</td>
        <td>${copyS}</td>
        <td>${recallS}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    container.innerHTML = html;
  }
  showPage('history');
}

function showRecordDetail(idx) {
  const records = JSON.parse(localStorage.getItem('rocf_records') || '[]');
  const r = records[idx];
  if (!r) return;
  const subj = r.subject || {};
  let tsDisplay = r.timestamp || '';
  if (tsDisplay.length >= 15) {
    tsDisplay = `${tsDisplay.slice(0,4)}-${tsDisplay.slice(4,6)}-${tsDisplay.slice(6,8)} ${tsDisplay.slice(9,11)}:${tsDisplay.slice(11,13)}:${tsDisplay.slice(13,15)}`;
  }
  alert(
    `被试编号: ${subj.id || '未知'}\n` +
    `年龄: ${subj.age || '-'}  性别: ${subj.gender || '-'}  利手: ${subj.hand || '-'}\n` +
    `测试时间: ${tsDisplay}\n\n` +
    `临摹阶段笔画数: ${r.copy ? r.copy.strokes : 0}\n` +
    `回忆阶段笔画数: ${r.recall ? r.recall.strokes : 0}`
  );
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
// Canvas 初始化（处理 devicePixelRatio）
// ============================================================
function initCanvases() {
  stimulusCanvas = document.getElementById('stimulusCanvas');
  drawCanvas = document.getElementById('drawCanvas');

  // 刺激图 Canvas
  const sRect = stimulusCanvas.parentElement.getBoundingClientRect();
  const sW = sRect.width - 16;
  const sH = sRect.height - 64;
  const dpr = window.devicePixelRatio || 1;
  stimulusCanvas.width = sW * dpr;
  stimulusCanvas.height = sH * dpr;
  stimulusCanvas.style.width = sW + 'px';
  stimulusCanvas.style.height = sH + 'px';
  stimulusCtx = stimulusCanvas.getContext('2d');
  stimulusCtx.scale(dpr, dpr);

  // 绘图 Canvas
  const dRect = drawCanvas.parentElement.getBoundingClientRect();
  const dW = dRect.width - 16;
  const dH = dRect.height - 16;
  drawCanvas.width = dW * dpr;
  drawCanvas.height = dH * dpr;
  drawCanvas.style.width = dW + 'px';
  drawCanvas.style.height = dH + 'px';
  drawCtx = drawCanvas.getContext('2d');
  drawCtx.scale(dpr, dpr);
}

// ============================================================
// 事件绑定
// ============================================================
function bindEvents() {
  // 绘图鼠标事件
  drawCanvas.addEventListener('mousedown', onDrawStart);
  drawCanvas.addEventListener('mousemove', onDrawMove);
  drawCanvas.addEventListener('mouseup', onDrawEnd);
  drawCanvas.addEventListener('mouseleave', onDrawEnd);

  // 绘图触摸事件
  drawCanvas.addEventListener('touchstart', onDrawStart, { passive: false });
  drawCanvas.addEventListener('touchmove', onDrawMove, { passive: false });
  drawCanvas.addEventListener('touchend', onDrawEnd);
  drawCanvas.addEventListener('touchcancel', onDrawEnd);

  // 窗口大小变化时重新初始化
  window.addEventListener('resize', () => {
    if (document.getElementById('page-experiment').classList.contains('active')) {
      initCanvases();
      redrawCanvas();
      if (currentPhase === 'copy') {
        drawReyFigure(stimulusCtx, stimulusCanvas.width / (window.devicePixelRatio || 1), stimulusCanvas.height / (window.devicePixelRatio || 1));
      }
    }
  });
}

// ============================================================
// 启动
// ============================================================
function init() {
  stimulusCanvas = document.getElementById('stimulusCanvas');
  drawCanvas = document.getElementById('drawCanvas');
  bindEvents();
}

document.addEventListener('DOMContentLoaded', init);
</script>
